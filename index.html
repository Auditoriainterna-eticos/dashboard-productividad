<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Productividad</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
}

.card-container {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-top: 30px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    width: 220px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.card h2 {
    margin: 0;
    font-size: 16px;
    color: #555;
}

.card p {
    font-size: 28px;
    margin: 10px 0 0 0;
    font-weight: bold;
}
</style>
</head>
<body>

<h1>Dashboard de Productividad</h1>

<div class="card-container">
    <div class="card">
        <h2>Total Facturas</h2>
        <p id="totalFacturas">0</p>
    </div>

    <div class="card">
        <h2>Total Minutos</h2>
        <p id="totalMinutos">0</p>
    </div>

    <div class="card">
        <h2>Promedio Min/Factura</h2>
        <p id="promedio">0</p>
    </div>
</div>

<script>

async function cargarExcel() {
    try {
        const response = await fetch("datos.xlsx");
        const data = await response.arrayBuffer();

        const workbook = XLSX.read(data, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);

        let totalFacturas = 0;
        let totalMinutos = 0;

        json.forEach(row => {
            if (row.FACTURA == 1) {
                totalFacturas += 1;
                totalMinutos += Number(row.TIEMPO_MIN) || 0;
            }
        });

        const promedio = totalFacturas > 0 
            ? (totalMinutos / totalFacturas).toFixed(2)
            : 0;

        document.getElementById("totalFacturas").innerText = totalFacturas;
        document.getElementById("totalMinutos").innerText = totalMinutos;
        document.getElementById("promedio").innerText = promedio;

    } catch (error) {
        console.error("Error cargando Excel:", error);
    }
}

window.onload = cargarExcel;

</script>

</body>
</html>
